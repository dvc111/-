<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识图谱证据检索与推理</title>
  <style>
    :root {
      --accent: #4f46e5;
      --accent-2: #0ea5e9;
      --accent-soft: #eef2ff;
      --green: #059669;
      --green-soft: #ecfdf5;
      --orange: #f59e0b;
      --text: #172033;
      --muted: #687386;
      --line: #e4e8f0;
      --surface: #ffffff;
      --background: #f5f7fb;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .header {
      padding: 30px 20px 28px;
      color: #fff;
      text-align: center;
      background: linear-gradient(135deg, #4f46e5, #6d4cc3);
    }

    .header h1 { margin: 0; font-size: 26px; font-weight: 700; }
    .header p { margin: 9px 0 0; color: rgba(255,255,255,.8); font-size: 14px; }

    .wrap { width: min(1080px, 100%); margin: 0 auto; padding: 22px 18px 36px; }

    .card {
      margin-bottom: 16px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(24, 32, 51, .035);
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .card-title { color: #526078; font-size: 16px; font-weight: 700; }
    .card-note { color: var(--muted); font-size: 12px; }
    .question { font-size: 21px; font-weight: 700; line-height: 1.55; }

    .summary { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .tag { padding: 5px 10px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; font-size: 12px; }

    .pipeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .pipeline-step {
      position: relative;
      min-height: 100px;
      padding: 17px 14px;
      background: #f8faff;
      border: 1px solid #dce4f5;
      border-radius: 12px;
      text-align: center;
    }

    .pipeline-step:not(:last-child)::after {
      content: "→";
      position: absolute;
      right: -17px;
      top: 36px;
      color: #9aa7be;
      font-size: 20px;
    }

    .step-number {
      display: inline-grid;
      width: 25px;
      height: 25px;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
    }

    .step-name { margin-top: 9px; font-size: 14px; font-weight: 700; }
    .step-desc { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
    .metric { padding: 15px; background: #f8faff; border: 1px solid #e3e8f2; border-radius: 11px; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-value { margin-top: 6px; font-size: 21px; font-weight: 750; }
    .metric-detail { margin-top: 3px; color: #8690a3; font-size: 11px; }

    .evidence-row {
      display: grid;
      grid-template-columns: 42px minmax(260px, 1fr) minmax(170px, .7fr) 58px;
      gap: 14px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .evidence-row:last-child { border-bottom: 0; }
    .rank { display: grid; width: 30px; height: 30px; place-items: center; color: #fff; background: var(--accent); border-radius: 9px; font-size: 13px; font-weight: 700; }
    .triple { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    .triple .entity { padding: 5px 8px; background: var(--accent-soft); border-radius: 7px; font-weight: 650; }
    .triple .relation { color: var(--muted); }
    .dde-note { margin-top: 7px; color: #8490a5; font-size: 11px; }
    .bar-track { height: 8px; overflow: hidden; background: #eceff5; border-radius: 999px; }
    .bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: inherit; transition: width .4s ease; }
    .probability { color: var(--muted); font-size: 13px; text-align: right; }

    .candidate {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr 60px;
      gap: 14px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .candidate:last-child { border-bottom: 0; }
    .candidate-name { overflow-wrap: anywhere; font-size: 15px; font-weight: 650; }

    .path { padding: 5px 0 16px; }
    .path + .path { padding-top: 16px; border-top: 1px solid var(--line); }
    .path:last-child { padding-bottom: 2px; }
    .path-answer { margin-bottom: 10px; color: var(--accent); font-size: 14px; font-weight: 700; }
    .path-content { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; font-size: 14px; line-height: 1.8; }
    .path-content .entity { padding: 5px 8px; background: var(--accent-soft); border-radius: 7px; font-weight: 650; }
    .path-content .relation { padding: 4px 8px; color: var(--muted); background: #f3f5f8; border-radius: 999px; }
    .arrow { color: #adb3c0; }

    .empty, .state { padding: 26px 8px; color: var(--muted); font-size: 14px; text-align: center; }
    .error { color: var(--danger); }
    .spinner { display: block; width: 26px; height: 26px; margin: 0 auto 10px; border: 3px solid #e5e7f1; border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    .button { width: 100%; padding: 13px 16px; color: #fff; background: var(--accent); border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
    .button:hover { background: #4338ca; }
    .button:disabled { cursor: wait; opacity: .58; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 760px) {
      .pipeline, .metrics { grid-template-columns: 1fr 1fr; }
      .pipeline-step:nth-child(2)::after { display: none; }
      .evidence-row { grid-template-columns: 36px 1fr 52px; }
      .evidence-row .bar-track { grid-column: 2 / 4; }
    }

    @media (max-width: 520px) {
      .header h1 { font-size: 22px; }
      .card { padding: 18px; }
      .pipeline, .metrics { grid-template-columns: 1fr; }
      .pipeline-step::after { display: none; }
      .candidate { grid-template-columns: minmax(90px, 120px) 1fr 48px; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) { .bar, .spinner { transition: none; animation: none; } }
  </style>
</head>
<body>
  <header class="header">
    <h1>知识图谱证据检索与推理</h1>
    <p>候选数据接收 · DDE 结构编码 · 证据相关性评分 · 候选答案排序</p>
  </header>

  <main class="wrap">
    <section class="card" aria-labelledby="question-title">
      <div class="card-title" id="question-title">用户问题</div>
      <div class="question" id="question-text">正在加载…</div>
      <div class="summary" id="summary" hidden></div>
    </section>

    <div id="result" aria-live="polite"></div>
    <button class="button" id="rerun-button" type="button">重新推理</button>
  </main>

  <script>
    const questionText = document.getElementById("question-text");
    const summary = document.getElementById("summary");
    const result = document.getElementById("result");
    const rerunButton = document.getElementById("rerun-button");
    const currentExample = new URLSearchParams(location.search).get("example") || "aspirin";

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function cardHeader(title, note) {
      const heading = element("div", "card-heading");
      heading.append(element("div", "card-title", title));
      if (note) heading.append(element("div", "card-note", note));
      return heading;
    }

    function showLoading() {
      const card = element("div", "card state");
      card.append(element("span", "spinner"), document.createTextNode("正在运行证据检索与图推理…"));
      result.replaceChildren(card);
    }

    function showError(message) {
      const card = element("div", "card state error", `请求失败：${message}`);
      result.replaceChildren(card);
    }

    function renderSummary(candidateCount, pathCount, evidenceCount) {
      summary.replaceChildren(
        element("span", "tag", `${evidenceCount} 条关键证据`),
        element("span", "tag", `${candidateCount} 个候选答案`),
        element("span", "tag", `${pathCount} 条推理路径`)
      );
      summary.hidden = false;
    }

    function renderPipeline(micro) {
      const card = element("section", "card");
      card.append(cardHeader("软件处理流程", "系统实时运行状态"));
      const pipeline = element("div", "pipeline");
      const spec = micro.feature_spec || {};
      const scorer = micro.scoring?.scorer_type === "mlp" ? "MLP评分" : "规则联合评分";
      [
        ["候选数据接收", "读取上游模块提供的候选三元组"],
        ["特征编码", `DDE结构特征 + ${spec.text_embedding_dim ?? 128}维语义表示`],
        [scorer, "计算每条候选证据的相关性"],
        ["结果输出", "筛选Top-K证据并交给GNN推理"],
      ].forEach(([name, desc], index) => {
        const step = element("div", "pipeline-step");
        step.append(element("span", "step-number", String(index + 1)), element("div", "step-name", name), element("div", "step-desc", desc));
        pipeline.append(step);
      });
      card.append(pipeline);

      const metrics = element("div", "metrics");
      [
        ["候选三元组", micro.input_triple_count ?? 0, "上游模块输入"],
        ["Top-K证据", micro.selected_triple_count ?? 0, "证据筛选输出"],
        ["DDE维度", spec.dde_dim ?? 0, "方向结构特征"],
        ["GNN输入", `${spec.gnn_input_dim ?? 0}维`, `${spec.text_embedding_dim ?? 0}维语义 + ${spec.dde_dim ?? 0}维DDE`],
      ].forEach(([label, value, detail]) => {
        const metric = element("div", "metric");
        metric.append(element("div", "metric-label", label), element("div", "metric-value", String(value)), element("div", "metric-detail", detail));
        metrics.append(metric);
      });
      card.append(metrics);
      return card;
    }

    function renderEvidenceList(micro) {
      const card = element("section", "card");
      card.append(cardHeader("Top-K关键证据评分", `评分器：${micro.scoring?.scorer_type === "mlp" ? "MLP" : "启发式联合评分"}`));
      if (!micro.evidence_triples.length) {
        card.append(element("div", "empty", "没有达到阈值的证据三元组"));
        return card;
      }
      micro.evidence_triples.forEach((evidence, index) => {
        const score = Math.min(1, Math.max(0, Number(evidence.relevance_score) || 0));
        const row = element("div", "evidence-row");
        const tripleBox = element("div");
        const triple = element("div", "triple");
        triple.append(
          element("span", "entity", evidence.head_label),
          element("span", "relation", `→ ${evidence.relation_label} →`),
          element("span", "entity", evidence.tail_label)
        );
        tripleBox.append(triple, element("div", "dde-note", `首尾实体均携带 ${evidence.head_dde.length} 维DDE结构特征`));
        const track = element("div", "bar-track");
        const bar = element("div", "bar");
        bar.style.width = `${(score * 100).toFixed(1)}%`;
        track.append(bar);
        row.append(element("div", "rank", String(index + 1)), tripleBox, track, element("div", "probability", `${(score * 100).toFixed(1)}%`));
        card.append(row);
      });
      return card;
    }

    function renderCandidates(candidates) {
      const card = element("section", "card");
      card.append(cardHeader("GNN候选答案排序", `${candidates.length} 个节点`));
      if (!candidates.length) {
        card.append(element("div", "empty", "暂未找到候选答案"));
        return card;
      }
      candidates.forEach((candidate) => {
        const probability = Math.min(1, Math.max(0, Number(candidate.prob) || 0));
        const row = element("div", "candidate");
        const track = element("div", "bar-track");
        const bar = element("div", "bar");
        bar.style.width = `${(probability * 100).toFixed(1)}%`;
        track.append(bar);
        row.append(
          element("div", "candidate-name", candidate.label || candidate.entity_id || "未知实体"),
          track,
          element("div", "probability", `${(probability * 100).toFixed(1)}%`)
        );
        card.append(row);
      });
      return card;
    }

    function renderPathNodes(container, nodes) {
      nodes.forEach((node, index) => {
        if (index > 0) container.append(element("span", "arrow", "→"));
        if (node.entity_id) container.append(element("span", "entity", node.label || node.entity_id));
        else if (node.relation_id) container.append(element("span", "relation", node.label || node.relation_id));
      });
    }

    function renderPaths(paths) {
      const card = element("section", "card");
      card.append(cardHeader("可解释推理路径", `${paths.length} 条`));
      if (!paths.length) {
        card.append(element("div", "empty", "暂未生成可解释路径"));
        return card;
      }
      paths.forEach((path, index) => {
        const nodes = Array.isArray(path.path) ? path.path : [];
        const answer = nodes.find((node) => node.entity_id === path.answer_entity_id);
        const item = element("div", "path");
        item.append(element("div", "path-answer", `${index + 1}. ${answer?.label || path.answer_entity_id || "候选答案"}`));
        const content = element("div", "path-content");
        renderPathNodes(content, nodes);
        item.append(content);
        card.append(item);
      });
      return card;
    }

    async function runInference() {
      rerunButton.disabled = true;
      summary.hidden = true;
      showLoading();
      try {
        const response = await fetch(`/api/micro-visualize?example=${encodeURIComponent(currentExample)}`, { headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error(`服务器返回 ${response.status}`);
        const data = await response.json();
        const candidates = Array.isArray(data.candidates) ? data.candidates : [];
        const paths = Array.isArray(data.paths) ? data.paths : [];
        const micro = data.micro_retrieval || { nodes: [], evidence_triples: [], feature_spec: {}, scoring: {} };
        micro.nodes = Array.isArray(micro.nodes) ? micro.nodes : [];
        micro.evidence_triples = Array.isArray(micro.evidence_triples) ? micro.evidence_triples : [];

        questionText.textContent = data.question || "未提供问题文本";
        renderSummary(candidates.length, paths.length, micro.evidence_triples.length);
        result.replaceChildren(
          renderPipeline(micro),
          renderEvidenceList(micro),
          renderCandidates(candidates),
          renderPaths(paths)
        );
      } catch (error) {
        showError(error instanceof Error ? error.message : "未知错误");
      } finally {
        rerunButton.disabled = false;
      }
    }

    rerunButton.addEventListener("click", runInference);
    runInference();
  </script>
</body>
</html>
