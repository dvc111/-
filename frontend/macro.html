<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宏观检索与 GNN 推理</title>
  <style>
    :root {
      --accent: #4f46e5;
      --accent-2: #0ea5e9;
      --accent-soft: #eef2ff;
      --blue-light: #eff6ff;
      --blue-border: #bfdbfe;
      --blue-text: #1d4ed8;
      --green-soft: #ecfdf5;
      --green-text: #059669;
      --text: #1a2233;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #ffffff;
      --background: #f4f6fb;
      --danger: #b42318;
      --shadow: 0 1px 3px rgba(15, 23, 42, .04), 0 2px 8px rgba(15, 23, 42, .04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      color: var(--text);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }

    /* ── 顶栏 ── */
    .topbar {
      background: #312e81;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .logo {
      width: 34px; height: 34px; flex-shrink: 0;
      display: grid; place-items: center;
      background: rgba(255,255,255,.14);
      border-radius: 8px;
      color: #fff;
      font-size: 16px; font-weight: 700;
    }
    .topbar h1 { color: #fff; font-size: 17px; font-weight: 650; white-space: nowrap; }
    .topbar .subtitle { color: rgba(255,255,255,.72); font-size: 11px; margin-top: 2px; white-space: nowrap; }
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .q-btn {
      min-width: 38px; height: 32px; padding: 0 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: all .15s ease;
    }
    .q-btn:hover { background: rgba(255,255,255,.2); }
    .q-btn.active { background: #fff; color: var(--accent); border-color: #fff; }

    .wrap {
      width: min(780px, 100%);
      margin: 0 auto;
      padding: 18px 16px 36px;
    }

    /* ── 通用卡片 ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    .card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 700;
      color: var(--text);
    }
    .card-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .card-body { padding: 18px; }

    /* badge */
    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .badge.accent { color: var(--accent); background: var(--accent-soft); }
    .badge.success { color: var(--green-text); background: var(--green-soft); }
    .badge.muted { color: var(--muted); background: #f1f5f9; }

    /* ── 区块1：用户问题 ── */
    .q-card-body {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }
    .q-card-body .question {
      font-size: 16px;
      font-weight: 650;
      line-height: 1.7;
      flex: 1;
      min-width: 0;
    }
    .q-tag {
      flex-shrink: 0;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      color: var(--accent);
      background: var(--accent-soft);
      white-space: nowrap;
    }

    /* ── 区块2：宏观检索概览 ── */
    /* 流程步骤 */
    .flow-steps {
      display: flex;
      align-items: flex-start;
      gap: 0;
      margin-bottom: 18px;
    }
    .flow-step {
      flex: 1;
      min-width: 0;
      padding: 14px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fafbfe;
      text-align: center;
      position: relative;
    }
    .flow-step-icon {
      width: 34px; height: 34px;
      margin: 0 auto 8px;
      display: grid; place-items: center;
      border-radius: 8px;
      background: var(--accent-soft);
      font-size: 16px;
    }
    .flow-step-label {
      font-size: 12px;
      font-weight: 750;
      color: var(--text);
      margin-bottom: 4px;
    }
    .flow-step-desc {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
    }
    .flow-arrow-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      flex-shrink: 0;
      padding-top: 20px;
    }
    .flow-arrow-icon {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
    }

    /* 统计小卡片 */
    .stat-row {
      display: flex;
      gap: 10px;
    }
    .stat-card {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafbfe;
      text-align: center;
    }
    .stat-card .stat-value {
      font-size: 20px;
      font-weight: 850;
      color: var(--text);
    }
    .stat-card .stat-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 650;
      margin-top: 4px;
    }
    .stat-card .stat-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── 区块3：宏观子图裁剪结果实体卡片 ── */
    /* 复用 .feat-grid .feat-card .feat-source .importance 等样式 */

    /* ── 候选答案 ── */
    .candidate {
      display: grid;
      grid-template-columns: 28px minmax(80px, 110px) 1fr 52px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .candidate:last-child { border-bottom: 0; }
    .rank {
      width: 22px; height: 22px;
      display: grid; place-items: center;
      border-radius: 50%;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 10px; font-weight: 700;
      flex-shrink: 0;
    }
    .rank.top { background: var(--accent); color: #fff; }
    .candidate-name { overflow-wrap: anywhere; font-size: 13px; font-weight: 650; }
    .bar-track { height: 7px; overflow: hidden; background: #eef1f6; border-radius: 999px; }
    .bar { height: 100%; background: var(--accent); border-radius: inherit; transition: width .45s ease; }
    .probability { color: var(--muted); font-size: 12px; text-align: right; font-weight: 650; }

    /* ── 推理路径 ── */
    .path { padding: 8px 0 14px; }
    .path + .path { padding-top: 16px; border-top: 1px dashed var(--line); }
    .path-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .path-index {
      width: 22px; height: 22px;
      display: grid; place-items: center;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }
    .path-answer { color: var(--text); font-size: 13px; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .path-score { color: var(--muted); font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .path-flow {
      position: relative;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 13px;
      line-height: 2;
      padding-left: 10px;
      border-left: 3px solid var(--line);
    }
    .entity {
      font-weight: 650;
      color: var(--text);
      background: var(--accent-soft);
      border: 1px solid #dfe6fb;
      padding: 3px 10px;
      border-radius: 7px;
      white-space: nowrap;
    }
    .entity.topic { background: var(--blue-light); border-color: var(--blue-border); color: var(--blue-text); }
    .entity.answer { background: var(--green-soft); border-color: #a7f3d0; color: var(--green-text); font-weight: 700; }
    .relation {
      color: var(--muted);
      font-size: 11px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .arrow { color: #a5b0c0; font-size: 11px; }

    /* ── 状态 ── */
    .empty, .state { padding: 30px 10px; color: var(--muted); font-size: 13px; text-align: center; }
    .error { color: var(--danger); }
    .spinner {
      display: block;
      width: 28px; height: 28px;
      margin: 0 auto 12px;
      border: 3px solid #e2e8f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 底部按钮 ── */
    .footer { display: flex; gap: 10px; margin-top: 4px; }
    .button {
      flex: 1;
      padding: 11px 16px;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: opacity .15s ease, transform .1s ease;
    }
    .button:hover { opacity: .88; }
    .button:active { transform: translateY(1px); }
    .button:disabled { cursor: wait; opacity: .5; }
    .button.secondary { background: #fff; color: var(--text); border: 1px solid var(--line); }

    /* ── GNN 子图可视化 ── */
    .viz-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .viz-tab {
      min-width: 64px; height: 30px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--muted);
      font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .viz-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .gnn-graph-wrap { margin-top: 4px; }
    .gnn-svg {
      display: block; width: 100%; height: auto;
      background: #fbfcfe;
      border: 1px solid var(--line); border-radius: 10px;
    }
    .graph-legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .legend-line { width: 22px; height: 3px; border-radius: 2px; }
    .legend-node { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); }
    .legend-node.topic { border-color: var(--accent); background: var(--accent); }
    .legend-node.answer { border-color: var(--green-text); background: var(--green-text); }
    .gnn-node { cursor: pointer; transition: opacity .15s ease; }
    .gnn-node.selected circle { stroke: #111827; stroke-width: 2.5; }
    .gnn-label { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 3px; }

    /* ── 特征融合 ── */
    .fusion-flow {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      margin-bottom: 16px; padding: 14px 16px;
      border: 1px solid var(--line); border-radius: 12px; background: #fafbfe;
    }
    .flow-sources { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .flow-source {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-width: 108px; padding: 10px 12px;
      border: 1px solid #dfe6fb; border-radius: 10px; background: #fff;
    }
    .flow-icon {
      width: 26px; height: 26px; display: grid; place-items: center;
      border-radius: 8px; color: #fff; font-size: 12px; font-weight: 800;
    }
    .flow-source.semantic .flow-icon { background: #6366f1; }
    .flow-source.structure .flow-icon { background: #0ea5e9; }
    .flow-source.attr .flow-icon { background: #f59e0b; }
    .flow-name { color: var(--text); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .flow-dim { color: var(--muted); font-size: 10px; }
    .flow-arrow-icon { color: var(--accent); font-size: 16px; font-weight: 800; line-height: 1; }
    .flow-center {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 16px; border-radius: 8px;
      color: #fff; font-size: 13px; font-weight: 750;
      background: var(--accent);
    }
    .flow-center.rgcn { background: #1e293b; }

    .feat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .feat-card {
      border: 1px solid var(--line); border-radius: 12px;
      background: #fff; overflow: hidden;
    }
    .feat-card-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--line); background: #fafbfe;
    }
    .feat-card-name { font-size: 14px; font-weight: 750; overflow-wrap: anywhere; }
    .type-badge {
      padding: 3px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 700; white-space: nowrap;
    }
    .type-badge.topic { background: var(--accent-soft); color: var(--accent); }
    .type-badge.answer { background: var(--green-soft); color: var(--green-text); }
    .feat-card-body { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
    .feat-source {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfe;
    }
    .feat-source-icon {
      width: 30px; height: 30px; display: grid; place-items: center;
      border-radius: 8px; color: #fff; font-size: 12px; font-weight: 800; flex-shrink: 0;
    }
    .feat-source.semantic .feat-source-icon { background: #6366f1; }
    .feat-source.structure .feat-source-icon { background: #0ea5e9; }
    .feat-source.attr .feat-source-icon { background: #f59e0b; }
    .feat-source-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .feat-source-label { color: var(--muted); font-size: 10px; font-weight: 600; }
    .feat-source-value { color: var(--text); font-size: 12px; font-weight: 750; overflow-wrap: anywhere; }
    .feat-source-dim { color: var(--muted); font-size: 10px; }
    .importance {
      padding: 9px 10px;
      border: 1px solid rgba(5,150,105,.2); border-radius: 10px;
      background: #fafdfc;
    }
    .importance-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 6px;
    }
    .importance-label { color: var(--muted); font-size: 10px; font-weight: 650; }
    .importance-value { color: var(--green-text); font-size: 12px; font-weight: 800; }
    .importance-track { height: 6px; overflow: hidden; background: #eef1f6; border-radius: 999px; }
    .importance-fill { height: 100%; border-radius: inherit; background: var(--green-text); transition: width .4s ease; }

    /* ── 消息传播 ── */
    .mp-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .mp-play {
      margin-left: auto; height: 30px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--text);
      font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .mp-graph { position: relative; }
    .mp-edge { transition: opacity .2s ease; }
    .mp-particle { filter: drop-shadow(0 1px 2px rgba(15,23,42,.3)); }
    .mp-detail { max-height: 340px; overflow-y: auto; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 4px; }
    .node-msg-row {
      display: grid;
      grid-template-columns: 150px minmax(0,1fr) 130px;
      gap: 12px; align-items: center;
      padding: 8px 0; border-bottom: 1px dashed var(--line);
    }
    .node-msg-row:last-child { border-bottom: 0; }
    .node-msg-name { overflow-wrap: anywhere; font-size: 12px; font-weight: 650; }
    .msg-bars { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .msg-bar { display: grid; grid-template-columns: 86px 1fr 46px; gap: 8px; align-items: center; }
    .msg-rel { color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg-track { height: 6px; overflow: hidden; background: #eef1f6; border-radius: 999px; }
    .msg-fill { height: 100%; border-radius: inherit; }
    .msg-count { color: var(--muted); font-size: 10px; text-align: right; }
    .node-msg-stat { color: var(--muted); font-size: 10px; line-height: 1.7; text-align: right; white-space: pre-line; }

    /* ── R-GCN V2 ── */
    .mp-section {
      border: 1px solid var(--line); border-radius: 12px;
      background: #fff; overflow: hidden; margin-bottom: 14px;
    }
    .mp-section-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 14px; border-bottom: 1px solid var(--line); background: #fafbfe;
    }
    .mp-section-title { color: var(--text); font-size: 13px; font-weight: 750; }
    .mp-section-body { padding: 14px; }
    .mp-input-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .mp-stat {
      padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfe;
    }
    .mp-stat-label { color: var(--muted); font-size: 10px; font-weight: 650; margin-bottom: 6px; }
    .mp-stat-value { color: var(--text); font-size: 16px; font-weight: 850; }
    .mp-stat-sub { color: var(--muted); font-size: 10px; margin-top: 4px; }
    .mp-layer-grid {
      display: grid;
      grid-template-columns: minmax(240px,1fr) minmax(260px,1.2fr);
      gap: 14px; align-items: start;
    }
    .mp-flow-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fafbfe; }
    .mp-flow-title { color: var(--muted); font-size: 10px; font-weight: 700; margin-bottom: 10px; }
    .mp-flow-steps { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .mp-flow-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .mp-flow-step {
      padding: 8px 12px; border: 1px solid #dfe6fb; border-radius: 10px;
      background: #fff; color: var(--text); font-size: 12px; font-weight: 700; text-align: center;
    }
    .mp-flow-step.hot { background: var(--accent); border-color: transparent; color: #fff; }
    .mp-flow-plus { color: var(--muted); font-size: 12px; font-weight: 800; align-self: center; }
    .mp-flow-arrow-down { color: var(--accent); font-size: 15px; font-weight: 800; line-height: 1; }
    .mp-chain { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .mp-chain-node {
      min-width: 160px; padding: 10px 14px;
      border: 1px solid var(--line); border-radius: 10px;
      background: #fff; text-align: center;
      animation: mpNodeGlow 2.6s ease-in-out infinite;
    }
    .mp-chain-node.topic { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .mp-chain-node.mid { border-color: var(--accent-2); background: var(--blue-light); color: var(--blue-text); }
    .mp-chain-node.target { border-color: var(--green-text); background: var(--green-soft); color: var(--green-text); }
    .mp-chain-node .name { font-size: 13px; font-weight: 800; }
    .mp-chain-node .dim { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .mp-chain-edge { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .mp-chain-edge .line { width: 26px; height: 2px; background: var(--accent); border-radius: 2px; }
    .mp-chain-edge .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: mpPulse 1.3s ease-in-out infinite;
    }
    .mp-chain-edge .rel { white-space: nowrap; }
    .mp-stats { display: flex; flex-direction: column; gap: 10px; }
    .mp-stat-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
    }
    .mp-stat-row .k { color: var(--muted); font-size: 11px; font-weight: 650; }
    .mp-stat-row .v { color: var(--text); font-size: 12px; font-weight: 800; text-align: right; }
    .mp-output-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .mp-output-card { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fafbfe; }
    .mp-output-name { font-size: 13px; font-weight: 800; margin-bottom: 6px; }
    .mp-output-dim { color: var(--muted); font-size: 11px; }
    .mp-output-score { margin-top: 8px; height: 5px; overflow: hidden; background: #eef1f6; border-radius: 999px; }
    .mp-output-score i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
    .mp-connector {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      background: #1e293b; color: #fff; font-size: 12px; font-weight: 750;
    }
    @keyframes mpPulse {
      0%,100% { transform: scale(1); opacity: .45; }
      50% { transform: scale(1.5); opacity: 1; }
    }
    @keyframes mpNodeGlow {
      0%,100% { box-shadow: 0 0 0 0 rgba(79,70,229,0); }
      50% { box-shadow: 0 0 0 4px rgba(79,70,229,.10); }
    }

    /* ── 响应式 ── */
    @media (max-width: 700px) {
      .topbar { padding: 14px 16px; flex-direction: column; align-items: stretch; }
      .topbar-right { justify-content: flex-start; }
      .wrap { padding: 14px 12px 28px; }
      .card-body { padding: 14px; }
      .q-card-body { flex-direction: column; }
      .flow-steps { flex-direction: column; }
      .flow-arrow-wrap { width: 100%; padding-top: 0; justify-content: center; transform: rotate(90deg); }
      .stat-row { flex-wrap: wrap; }
      .stat-card { min-width: calc(50% - 5px); }
      .feat-grid { grid-template-columns: 1fr; }
      .candidate { grid-template-columns: 26px minmax(72px,96px) 1fr 46px; gap: 8px; }
      .mp-input-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .mp-layer-grid { grid-template-columns: 1fr; }
      .mp-output-grid { grid-template-columns: 1fr; }
      .node-msg-row { grid-template-columns: 1fr; gap: 6px; }
      .node-msg-stat { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar, .spinner, .mp-chain-node, .mp-chain-edge .dot { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">G</div>
      <div>
        <h1>宏观检索与 GNN 推理</h1>
        <div class="subtitle">超关系语义规划 · 宏观子图裁剪 · R-GCN 节点评分</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="q-btn" data-q="1">Q1</button>
      <button class="q-btn" data-q="2">Q2</button>
      <button class="q-btn" data-q="3">Q3</button>
      <button class="q-btn" data-q="4">Q4</button>
      <button class="q-btn" data-q="5">Q5</button>
    </div>
  </header>

  <main class="wrap">
    <!-- 区块1：用户问题 -->
    <section class="card" id="question-card">
      <div class="card-head">
        <div class="card-title"><span class="dot"></span>用户问题</div>
        <span class="badge accent" id="q-badge">示例问题</span>
      </div>
      <div class="card-body">
        <div class="q-card-body">
          <div class="question" id="question-text">正在加载…</div>
          <span class="q-tag" id="q-tag-text">加载中</span>
        </div>
      </div>
    </section>

    <!-- 区块2：宏观检索概览 -->
    <section class="card" id="macro-card" hidden>
      <div class="card-head">
        <div class="card-title"><span class="dot"></span>宏观检索概览</div>
        <span class="badge success">检索完成</span>
      </div>
      <div class="card-body" id="macro-body"></div>
    </section>

    <!-- 区块3+：候选答案 + GNN 推理 -->
    <div id="result" aria-live="polite"></div>

    <div class="footer">
      <button class="button secondary" id="copy-button" type="button">复制结果</button>
      <button class="button" id="rerun-button" type="button">重新推理</button>
    </div>
  </main>

  <script>
    /* ====== 本地知识图谱数据（实体类型 & 关系标签） ====== */
    const KG_ENTITIES = {
      "Q1024": { label: "阿司匹林", type: "药物" },
      "Q1088": { label: "布洛芬", type: "药物" },
      "Q1500": { label: "华法林", type: "药物" },
      "Q1600": { label: "对乙酰氨基酚", type: "药物" },
      "Q2031": { label: "胃肠道出血", type: "不良反应" },
      "Q2099": { label: "肾功能损伤", type: "不良反应" },
      "Q2100": { label: "出血风险增加", type: "不良反应" },
      "Q2200": { label: "胃溃疡", type: "疾病" },
      "Q2300": { label: "哮喘", type: "疾病" },
      "Q3000": { label: "解热镇痛药", type: "药物分类" },
      "Q3001": { label: "非甾体抗炎药", type: "药物分类" },
      "Q3002": { label: "抗凝血药", type: "药物分类" },
      "Q4000": { label: "头痛", type: "适应症" },
      "Q4001": { label: "发热", type: "适应症" },
      "Q4002": { label: "血栓", type: "适应症" },
      "Q5000": { label: "胃黏膜损伤", type: "药理机制" },
      "Q5001": { label: "COX酶抑制", type: "药理机制" },
      "Q5002": { label: "血小板聚集抑制", type: "药理机制" },
    };
    const KG_RELATIONS = {
      "R017": { label: "可能引发", hyper_relation_id: "HR03" },
      "R018": { label: "增强作用", hyper_relation_id: "HR03" },
      "R019": { label: "合用增加风险", hyper_relation_id: "HR03" },
      "R020": { label: "禁用于", hyper_relation_id: "HR07" },
      "R021": { label: "慎用于", hyper_relation_id: "HR07" },
      "R022": { label: "属于", hyper_relation_id: "HR04" },
      "R023": { label: "用于治疗", hyper_relation_id: "HR02" },
      "R024": { label: "可能导致", hyper_relation_id: "HR01" },
      "R025": { label: "加重", hyper_relation_id: "HR01" },
      "R026": { label: "影响", hyper_relation_id: "HR08" },
      "R027": { label: "增加风险", hyper_relation_id: "HR08" },
    };
    const KG_HYPER_RELATIONS = {
      "HR01": { label: "不良反应" },
      "HR02": { label: "适应症" },
      "HR03": { label: "药物相互作用" },
      "HR04": { label: "药物分类" },
      "HR07": { label: "禁忌症" },
      "HR08": { label: "药理机制" },
    };
    /* 全 KG 出度归一化（max_degree = 11，来自 Q1024） */
    const KG_NORM_DEGREE = {
      "Q1024": 1.0000, "Q1088": 0.6364, "Q1500": 0.4545, "Q1600": 0.0000,
      "Q2031": 0.0000, "Q2099": 0.0000, "Q2100": 0.0000, "Q2200": 0.0000,
      "Q2300": 0.0000, "Q3000": 0.0000, "Q3001": 0.0000, "Q3002": 0.0000,
      "Q4000": 0.0000, "Q4001": 0.0000, "Q4002": 0.0000, "Q5000": 0.0909,
      "Q5001": 0.0909, "Q5002": 0.0909,
    };

    const questionText = document.getElementById("question-text");
    const qTagText = document.getElementById("q-tag-text");
    const macroCard = document.getElementById("macro-card");
    const macroBody = document.getElementById("macro-body");
    const result = document.getElementById("result");
    const rerunButton = document.getElementById("rerun-button");
    const copyButton = document.getElementById("copy-button");
    const qBadge = document.getElementById("q-badge");

    const QUESTION_NAMES = {
      1: "药物相互作用风险",
      2: "阿司匹林副作用",
      3: "布洛芬副作用",
      4: "阿司匹林分类",
      5: "华法林相互作用",
    };

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function setActiveQuestion(q) {
      document.querySelectorAll(".q-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.q === String(q));
      });
      if (QUESTION_NAMES[q]) {
        qBadge.textContent = QUESTION_NAMES[q];
        qTagText.textContent = QUESTION_NAMES[q];
      }
    }

    function showLoading() {
      const card = element("section", "card");
      const body = element("div", "card-body state");
      body.append(element("span", "spinner"), document.createTextNode("正在运行推理…"));
      card.append(body);
      result.replaceChildren(card);
    }

    function showError(message) {
      const card = element("section", "card");
      const body = element("div", "card-body state error", `请求失败：${message}`);
      card.append(body);
      result.replaceChildren(card);
    }

    function renderMacroInfo(data) {
      /* 区块2：宏观检索概览 — 4步流程 + 5统计指标 */
      const subgraph = data.macro_subgraph || {};
      const nodes = subgraph.nodes || [];
      const triples = subgraph.triples || [];
      const hyperRels = data.selected_hyper_relations || data.hyper_relations || [];
      const topicIds = data.topic_entity_ids || data.topic_entities || [];
      const maxHops = data.max_hops || 2;
      const relationTypes = new Set(triples.map((t) => t[1]));

      macroBody.replaceChildren();

      /* ── 顶部：4步流程 ── */
      const flowRow = element("div", "flow-steps");
      const steps = [
        { icon: "🔗", label: "实体链接", desc: "识别问题中的主题实体" },
        { icon: "🔍", label: "超关系规划", desc: "LLM 语义匹配，确定搜索方向" },
        { icon: "⑂", label: "约束扩展", desc: "基于超关系，2-hop 约束搜索" },
        { icon: "🧊", label: "子图生成", desc: "输出宏观候选子图供 GNN 推理" },
      ];
      steps.forEach((step, i) => {
        const stepCard = element("div", "flow-step");
        stepCard.append(
          element("div", "flow-step-icon", step.icon),
          element("div", "flow-step-label", step.label),
          element("div", "flow-step-desc", step.desc),
        );
        flowRow.append(stepCard);
        if (i < steps.length - 1) {
          const arrowWrap = element("div", "flow-arrow-wrap");
          arrowWrap.append(element("span", "flow-arrow-icon", "→"));
          flowRow.append(arrowWrap);
        }
      });
      macroBody.append(flowRow);

      /* ── 底部：5组统计卡片 ── */
      const statRow = element("div", "stat-row");
      const topicLabels = topicIds.map((eid) => {
        const kg = KG_ENTITIES[eid];
        return kg ? kg.label : eid;
      }).join("，") || "—";
      const hrLabels = hyperRels.map((hr) => `${hr.label} (${(hr.score * 100).toFixed(0)}%)`).join("，") || "—";

      const statDefs = [
        { value: topicIds.length, label: "主题实体", sub: topicLabels },
        { value: hyperRels.length, label: "选定超关系", sub: hrLabels },
        { value: nodes.length, label: "子图节点数", sub: `${nodes.length} 个实体数量` },
        { value: triples.length, label: "子图关系数", sub: `${triples.length} 条 关系三元组数量` },
        { value: `${maxHops} hop`, label: "搜索深度", sub: `${maxHops} hop 约束搜索范围` },
      ];
      statDefs.forEach((def) => {
        const card = element("div", "stat-card");
        card.append(
          element("div", "stat-value", String(def.value)),
          element("div", "stat-label", def.label),
          element("div", "stat-sub", def.sub),
        );
        statRow.append(card);
      });
      macroBody.append(statRow);

      macroCard.hidden = false;
    }

    function renderMacroPruning(data) {
      /* 区块3：宏观子图裁剪结果 — 实体小框图（初始重要性三因素分解） */
      const subgraph = data.macro_subgraph || {};
      const nodes = subgraph.nodes || [];
      const triples = subgraph.triples || [];
      const topicSet = new Set(data.topic_entity_ids || data.topic_entities || []);
      if (!nodes.length) return document.createDocumentFragment();

      /* 预计算：节点度（全 KG 出度归一化，与后端 normalized_degree 一致） */
      const centrality = (eid) => KG_NORM_DEGREE[eid] || 0;

      /* 预计算：实体链接置信度 */
      const linkingMap = {};
      (data.entity_linking || []).forEach((el) => { linkingMap[el.entity_id] = el.confidence; });

      /* 预计算：超关系得分映射 */
      const hrScoreMap = {};
      (data.selected_hyper_relations || []).forEach((hr) => { hrScoreMap[hr.relation_id] = hr.score; });

      /* 预计算：每个非主题实体的最佳超关系得分 */
      const bestHrScore = {};
      nodes.forEach((n) => {
        if (n.is_topic || topicSet.has(n.entity_id)) return;
        let best = 0;
        triples.forEach((t) => {
          if (t[2] !== n.entity_id) return;
          const rel = KG_RELATIONS[t[1]];
          if (!rel) return;
          const hrScore = hrScoreMap[rel.hyper_relation_id] || 0;
          if (hrScore > best) best = hrScore;
        });
        bestHrScore[n.entity_id] = best;
      });

      const panel = element("section", "card");
      const head = element("div", "card-head");
      const headTitle = element("div", "card-title");
      headTitle.append(element("span", "dot"), document.createTextNode("宏观子图裁剪结果"));
      head.append(headTitle, element("span", "badge accent", `${nodes.length} 个实体 / ${triples.length} 条关系`));
      panel.append(head);
      const body = element("div", "card-body");

      const grid = element("div", "feat-grid");
      const sorted = [...nodes].sort((a, b) => Number(b.initial_importance || 0) - Number(a.initial_importance || 0));

      sorted.forEach((node) => {
        const eid = node.entity_id;
        const kg = KG_ENTITIES[eid] || {};
        const kgType = kg.type || "";
        const isTopic = node.is_topic || topicSet.has(eid);
        const importance = Math.max(0, Math.min(1, Number(node.initial_importance) || 0));
        const linkConf = linkingMap[eid] || 0;
        const hrScore = bestHrScore[eid] || 0;
        const cent = centrality(eid);

        const card = element("div", "feat-card");
        card.dataset.nodeId = eid;

        /* 头部 */
        const cardHead = element("div", "feat-card-head");
        cardHead.append(element("div", "feat-card-name", node.label || eid));
        if (isTopic) cardHead.append(element("span", "type-badge topic", "主题实体"));
        else if (kgType) cardHead.append(element("span", "type-badge answer", kgType));
        card.append(cardHead);

        const cardBody = element("div", "feat-card-body");

        /* ① 来源 */
        const srcRow = element("div", "feat-source semantic");
        const srcIcon = element("span", "feat-source-icon", isTopic ? "🔗" : "⑂");
        const srcInfo = element("div", "feat-source-info");
        srcInfo.append(
          element("div", "feat-source-label", isTopic ? "来源 · 主题实体（实体链接）" : "来源 · 超关系约束扩展"),
          element("div", "feat-source-value", isTopic ? `ID: ${eid}  ·  问题中直接识别` : `ID: ${eid}  ·  2-hop 约束搜索发现`),
          element("div", "feat-source-dim", kgType ? `类型: ${kgType}` : "")
        );
        srcRow.append(srcIcon, srcInfo);
        cardBody.append(srcRow);

        if (isTopic) {
          /* ② 链接置信度 */
          const linkRow = element("div", "feat-source structure");
          linkRow.append(
            element("span", "feat-source-icon", "🎯"),
            element("div", "feat-source-info", ""),
          );
          linkRow.querySelector(".feat-source-info").append(
            element("div", "feat-source-label", `实体链接置信度 = ${linkConf.toFixed(3)}  ·  权重 0.7`),
            element("div", "feat-source-dim", "LLM 实体链接匹配得分")
          );
          cardBody.append(linkRow);

          /* ③ 中心性 */
          const centRow = element("div", "feat-source attr");
          centRow.append(
            element("span", "feat-source-icon", "🕸"),
            element("div", "feat-source-info", ""),
          );
          centRow.querySelector(".feat-source-info").append(
            element("div", "feat-source-label", `节点中心性 = ${cent.toFixed(3)}  ·  权重 0.3`),
            element("div", "feat-source-dim", "全 KG 出度归一化（max_degree=11）")
          );
          cardBody.append(centRow);
        } else {
          /* ② 超关系得分 */
          const hrName = (() => {
            for (const t of triples) {
              if (t[2] !== eid) continue;
              const rel = KG_RELATIONS[t[1]];
              if (!rel) continue;
              const hr = KG_HYPER_RELATIONS[rel.hyper_relation_id];
              if (hr && hrScoreMap[rel.hyper_relation_id] === hrScore) return hr.label;
            }
            return "超关系";
          })();
          const hrRow = element("div", "feat-source structure");
          hrRow.append(
            element("span", "feat-source-icon", "🔍"),
            element("div", "feat-source-info", ""),
          );
          hrRow.querySelector(".feat-source-info").append(
            element("div", "feat-source-label", `超关系得分「${hrName}」= ${hrScore.toFixed(3)}  ·  权重 0.6`),
            element("div", "feat-source-dim", "将该实体引入子图的最高分超关系")
          );
          cardBody.append(hrRow);

          /* ③ 中心性 */
          const centRow = element("div", "feat-source attr");
          centRow.append(
            element("span", "feat-source-icon", "🕸"),
            element("div", "feat-source-info", ""),
          );
          centRow.querySelector(".feat-source-info").append(
            element("div", "feat-source-label", `节点中心性 = ${cent.toFixed(3)}  ·  权重 0.4`),
            element("div", "feat-source-dim", "全 KG 出度归一化（max_degree=11）")
          );
          cardBody.append(centRow);
        }

        /* ⑤ 重要性进度条 */
        const imp = element("div", "importance");
        const impHead = element("div", "importance-head");
        impHead.append(
          element("div", "importance-label", "宏观初始重要性"),
          element("div", "importance-value", `${(importance * 100).toFixed(1)}%`)
        );
        const impTrack = element("div", "importance-track");
        const impFill = element("div", "importance-fill");
        impFill.style.width = `${(importance * 100).toFixed(1)}%`;
        impTrack.append(impFill);
        imp.append(impHead, impTrack);
        cardBody.append(imp);

        card.append(cardBody);
        grid.append(card);
      });

      body.append(grid);
      panel.append(body);
      return panel;
    }

    function renderCandidates(candidates) {
      const panel = element("section", "card");
      const head = element("div", "card-head");
      const headTitle = element("div", "card-title");
      headTitle.append(element("span", "dot"), document.createTextNode("候选答案"));
      head.append(headTitle, element("span", "badge accent", `${candidates.length} 个`));
      panel.append(head);
      const body = element("div", "card-body");

      if (!candidates.length) {
        body.append(element("div", "empty", "暂未找到候选答案"));
        panel.append(body);
        return panel;
      }

      candidates.forEach((candidate, index) => {
        const probability = Math.min(1, Math.max(0, Number(candidate.prob) || 0));
        const row = element("div", "candidate");
        const rank = element("span", "rank" + (index < 3 ? " top" : ""), String(index + 1));
        const track = element("div", "bar-track");
        const bar = element("div", "bar");
        bar.style.width = `${(probability * 100).toFixed(1)}%`;
        track.append(bar);
        row.append(
          rank,
          element("div", "candidate-name", candidate.label || candidate.entity_id || "未知实体"),
          track,
          element("div", "probability", `${(probability * 100).toFixed(1)}%`)
        );
        body.append(row);
      });

      panel.append(body);
      return panel;
    }

    function renderPathNodes(container, nodes, topicIds, answerId) {
      const topicSet = new Set(topicIds || []);
      nodes.forEach((node, index) => {
        if (index > 0) container.append(element("span", "arrow", "→"));
        if (node.entity_id) {
          let cls = "entity";
          if (topicSet.has(node.entity_id)) cls += " topic";
          if (node.entity_id === answerId) cls += " answer";
          container.append(element("span", cls, node.label || node.entity_id));
        } else if (node.relation_id) {
          container.append(element("span", "relation", node.label || node.relation_id));
        }
      });
    }

    function renderPaths(paths, topicIds) {
      const panel = element("section", "card");
      const head = element("div", "card-head");
      const headTitle = element("div", "card-title");
      headTitle.append(element("span", "dot"), document.createTextNode("推理路径"));
      head.append(headTitle, element("span", "badge accent", `${paths.length} 条`));
      panel.append(head);
      const body = element("div", "card-body");

      if (!paths.length) {
        body.append(element("div", "empty", "暂未生成可解释路径"));
        panel.append(body);
        return panel;
      }

      paths.forEach((path, index) => {
        const nodes = Array.isArray(path.path) ? path.path : [];
        const answerId = path.answer_entity_id;
        const answer = nodes.find((node) => node.entity_id === answerId);
        const item = element("div", "path");

        const headRow = element("div", "path-head");
        headRow.append(element("span", "path-index", String(index + 1)));
        headRow.append(element("span", "path-answer", answer?.label || answerId || "候选答案"));
        const score = Number(path.path_score) || 0;
        if (score > 0) headRow.append(element("span", "path-score", `得分 ${score.toFixed(3)}`));
        item.append(headRow);

        const flow = element("div", "path-flow");
        renderPathNodes(flow, nodes, topicIds, answerId);
        item.append(flow);
        body.append(item);
      });

      panel.append(body);
      return panel;
    }

    const REL_COLORS = ["#4f46e5", "#0ea5e9", "#f59e0b", "#059669", "#dc2626", "#8b5cf6", "#14b8a6", "#f43f5e", "#64748b"];
    let markerCounter = 0;

    function relationColor(relationType) {
      return REL_COLORS[Number(relationType ?? 0) % REL_COLORS.length] || REL_COLORS[0];
    }

    function svgElement(tag, attrs = {}, text) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => {
        if (value !== undefined && value !== null) node.setAttribute(key, value);
      });
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function computeGraphLayout(nodeIds, width = 760, height = 420) {
      const cx = width / 2;
      const cy = height / 2;
      const maxRadius = Math.min(width / 2 - 64, height / 2 - 64);
      const radius = Math.min(maxRadius, Math.max(110, 90 + nodeIds.length * 13));
      const start = -Math.PI / 2;
      const step = (2 * Math.PI) / Math.max(1, nodeIds.length);
      const positions = new Map();
      nodeIds.forEach((id, index) => {
        const angle = start + index * step;
        positions.set(id, {
          x: cx + radius * Math.cos(angle),
          y: cy + radius * Math.sin(angle),
        });
      });
      return positions;
    }

    function renderGraphSvg(container, graph, answerIds, opts = {}) {
      const width = opts.width || 760;
      const height = opts.height || 420;
      const topicIds = new Set((graph.nodes || []).filter((n) => n.is_topic).map((n) => n.entity_id));
      const answerSet = new Set(answerIds || []);
      const ordered = [...(graph.nodes || [])].sort((a, b) => Number(b.is_topic || 0) - Number(a.is_topic || 0));
      const positions = computeGraphLayout(ordered.map((n) => n.entity_id), width, height);
      const svg = svgElement("svg", { viewBox: `0 0 ${width} ${height}`, class: "gnn-svg", role: "img" });
      const defs = svgElement("defs");
      const markerIds = new Map();
      [...new Set((graph.edges || []).map((e) => e.relation_type ?? 0))].forEach((rt) => {
        const markerId = `gnn-arrow-${++markerCounter}`;
        markerIds.set(rt, markerId);
        const marker = svgElement("marker", {
          id: markerId,
          viewBox: "0 0 10 10",
          refX: 9,
          refY: 5,
          markerWidth: 6,
          markerHeight: 6,
          orient: "auto-start-reverse",
        });
        marker.append(svgElement("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: relationColor(rt) }));
        defs.append(marker);
      });
      svg.append(defs);

      const edgeElements = new Map();
      (graph.edges || []).forEach((edge) => {
        const from = positions.get(edge.source);
        const to = positions.get(edge.target);
        if (!from || !to) return;
        const rt = edge.relation_type ?? 0;
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const dist = Math.hypot(dx, dy) || 1;
        const gap = 16;
        const line = svgElement("line", {
          x1: from.x + (dx / dist) * gap,
          y1: from.y + (dy / dist) * gap,
          x2: to.x - (dx / dist) * gap,
          y2: to.y - (dy / dist) * gap,
          stroke: relationColor(rt),
          "stroke-width": 1.6,
          "stroke-opacity": opts.faded ? 0.22 : 0.7,
          "marker-end": `url(#${markerIds.get(rt)})`,
        });
        svg.append(line);
        edgeElements.set(`${edge.source}|${edge.target}|${rt}`, line);
      });

      const nodeElements = new Map();
      (graph.nodes || []).forEach((node) => {
        const pos = positions.get(node.entity_id);
        if (!pos) return;
        const isTopic = topicIds.has(node.entity_id);
        const isAnswer = answerSet.has(node.entity_id);
        const g = svgElement("g", { class: "gnn-node" + (isAnswer ? " answer" : "") });
        g.append(svgElement("circle", {
          cx: pos.x,
          cy: pos.y,
          r: isTopic ? 17 : 14,
          fill: isAnswer ? "#059669" : isTopic ? "var(--accent)" : "#e2e8f0",
          stroke: isAnswer ? "#047857" : isTopic ? "var(--accent)" : "#94a3b8",
          "stroke-width": isTopic || isAnswer ? 2 : 1.5,
        }));
        const dx = pos.x - width / 2;
        const dy = pos.y - height / 2;
        const lx = Math.min(width - 8, Math.max(8, pos.x + Math.sign(dx || 1) * 28));
        const ly = Math.min(height - 8, Math.max(8, pos.y + Math.sign(dy || 1) * 22));
        g.append(svgElement("text", {
          x: lx,
          y: ly,
          class: "gnn-label",
          "text-anchor": Math.abs(dx) < 26 ? "middle" : dx < 0 ? "end" : "start",
        }, node.label || node.entity_id));
        g.style.cursor = "pointer";
        g.addEventListener("click", () => {
          document.querySelectorAll(".gnn-node.selected").forEach((el) => el.classList.remove("selected"));
          g.classList.add("selected");
          if (opts.onNodeClick) opts.onNodeClick(node.entity_id);
        });
        svg.append(g);
        nodeElements.set(node.entity_id, g);
      });

      container.replaceChildren(svg);
      return { svg, positions, nodeElements, edgeElements };
    }

    function renderMessagePassing(viz, answerIds) {
      const panel = element("section", "card");
      const layers = viz.layers || [];
      const head = element("div", "card-head");
      const headTitle = element("div", "card-title");
      headTitle.append(element("span", "dot"), document.createTextNode("R-GCN 消息传播"));
      head.append(headTitle, element("span", "badge accent", `${layers.length} 层`));
      panel.append(head);
      const body = element("div", "card-body");

      const controls = element("div", "mp-controls");
      const tabs = element("div", "viz-tabs");
      layers.forEach((layer, index) => {
        const tab = element("button", "viz-tab" + (index === 0 ? " active" : ""), `层 ${index + 1}`);
        tab.type = "button";
        tab.addEventListener("click", () => {
          stopPlayback();
          setLayer(index);
        });
        tabs.append(tab);
      });
      const playButton = element("button", "mp-play", "播放传播动画");
      playButton.type = "button";
      controls.append(tabs, playButton);
      const graphBox = element("div", "mp-graph");
      const detail = element("div", "mp-detail");
      body.append(controls, graphBox, detail);

      let playbackTimer = null;
      const animations = [];

      function clearAnimations() {
        animations.splice(0).forEach((animation) => animation.cancel && animation.cancel());
      }

      function stopPlayback() {
        if (playbackTimer) { clearTimeout(playbackTimer); playbackTimer = null; }
        playButton.textContent = "播放传播动画";
      }

      function setLayer(index) {
        if (!layers[index]) return;
        clearAnimations();
        tabs.querySelectorAll(".viz-tab").forEach((tab, i) => tab.classList.toggle("active", i === index));
        const layer = layers[index];
        const base = renderGraphSvg(graphBox, viz, answerIds, {
          faded: true,
          onNodeClick: (entityId) => {
            const row = detail.querySelector(`.node-msg-row[data-node-id="${entityId}"]`);
            if (!row) return;
            row.scrollIntoView({ behavior: "smooth", block: "nearest" });
            row.style.boxShadow = "0 0 0 2px var(--accent)";
            setTimeout(() => { row.style.boxShadow = ""; }, 1200);
          },
        });
        const overlay = svgElement("g", { class: "mp-overlay" });
        layer.edge_messages.forEach((msg) => {
          const from = base.positions.get(msg.source);
          const to = base.positions.get(msg.target);
          if (!from || !to) return;
          const rt = msg.relation_type ?? 0;
          const color = relationColor(rt);
          const normalized = Math.max(0, Math.min(1, msg.normalized || 0));
          overlay.append(svgElement("line", {
            x1: from.x,
            y1: from.y,
            x2: to.x,
            y2: to.y,
            stroke: color,
            "stroke-width": (1 + normalized * 5).toFixed(2),
            "stroke-opacity": (0.25 + normalized * 0.75).toFixed(2),
            class: "mp-edge",
          }));
          const particle = svgElement("circle", {
            cx: from.x,
            cy: from.y,
            r: 3 + normalized * 2,
            fill: color,
            class: "mp-particle",
          });
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const animation = particle.animate(
            [
              { transform: "translate(0px, 0px)" },
              { transform: `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)` },
            ],
            { duration: 850 + Math.random() * 600, delay: Math.random() * 350, iterations: Infinity, easing: "ease-in-out" }
          );
          animations.push(animation);
          overlay.append(particle);
        });
        base.svg.append(overlay);

        const maxNodeNorm = Math.max(1e-9, ...layer.node_states.map((s) => (s.incoming || []).reduce((sum, m) => sum + m.norm, 0)));
        const sortedStates = [...layer.node_states].sort((a, b) => {
          const aSum = (a.incoming || []).reduce((sum, m) => sum + m.norm, 0);
          const bSum = (b.incoming || []).reduce((sum, m) => sum + m.norm, 0);
          return bSum - aSum;
        });
        const detailRows = sortedStates.map((state) => {
          const row = element("div", "node-msg-row");
          row.dataset.nodeId = state.entity_id;
          row.append(
            element("div", "node-msg-name", state.label || state.entity_id),
            renderMessageBars(state, maxNodeNorm),
            element("div", "node-msg-stat",
              `Δ ${state.delta?.toFixed(3) ?? "—"} · ‖h‖ ${state.embedding_norm?.toFixed(3) ?? "—"} · 自环 ${state.self_loop_norm?.toFixed(3) ?? "—"}`)
          );
          return row;
        });
        detail.replaceChildren(...detailRows);
      }

      function playThrough() {
        if (!layers.length) return;
        stopPlayback();
        let index = 0;
        setLayer(0);
        playButton.textContent = "播放中…";
        const step = () => {
          index += 1;
          if (index >= layers.length) {
            playButton.textContent = "播放传播动画";
            return;
          }
          setLayer(index);
          playbackTimer = setTimeout(step, 1900);
        };
        playbackTimer = setTimeout(step, 1900);
      }

      playButton.addEventListener("click", () => {
        if (playbackTimer) { stopPlayback(); return; }
        playThrough();
      });

      if (layers.length) setLayer(0);
      return panel;
    }

    function renderMiniChain(nodes, rels) {
      const chain = element("div", "mp-chain");

        box.append(element("div", "name", node.label));

    function mpNodeLabels(viz) {
      const map = {};
      (viz.nodes || []).forEach((node) => { map[node.entity_id] = node.label || node.entity_id; });
      return map;
    }

    function mpRelationLabels(viz) {
      const map = {};
      (viz.edges || []).forEach((edge) => {
        if (!(edge.relation_id in map)) map[edge.relation_id] = edge.label || edge.relation_id;
      });
      return map;
    }

    function buildLayerChain(viz, layer, hop) {
      const labels = mpNodeLabels(viz);
      const rels = mpRelationLabels(viz);
      if (hop === 1) {
        const msg = (layer?.edge_messages || []).find((m) => labels[m.source] && labels[m.target]);
        if (!msg) return null;
        return renderMiniChain(
          [
            { label: labels[msg.source] || msg.source, cls: "topic" },
            { label: labels[msg.target] || msg.target, cls: "target", dim: "接收邻居消息" },
          ],
          [rels[msg.relation_id] || msg.relation_id]
        );
      }
      const edges = viz.edges || [];
      const topics = (viz.nodes || []).filter((node) => node.is_topic).map((node) => node.entity_id);
      for (const topic of topics) {
        const first = edges.find((edge) => edge.source === topic);
        if (!first) continue;
        const second = edges.find((edge) => edge.source === first.target);
        if (!second) continue;
        return renderMiniChain(
          [
            { label: labels[topic] || topic, cls: "topic" },
            { label: labels[first.target] || first.target, cls: "mid", dim: "中间节点" },
            { label: labels[second.target] || second.target, cls: "target", dim: "二阶邻居" },
          ],
          [rels[first.relation_id] || first.relation_id, rels[second.relation_id] || second.relation_id]
        );
      }
      return null;
    }

    function renderLayerSection(viz, layer, hop) {
      const isLayer2 = hop === 2;
      const title = isLayer2 ? "Layer 2 高阶语义传播" : "Layer 1 邻居信息聚合";
      const badge = isLayer2 ? "2-hop 邻居" : "直接邻居";
      const sec = mpSection(title, badge);
      const grid = element("div", "mp-layer-grid");

      const flowCard = element("div", "mp-flow-card");
      flowCard.append(element("div", "mp-flow-title", isLayer2 ? "跨层传播流程" : "邻居信息聚合流程"));
      const steps = element("div", "mp-flow-steps");
      if (isLayer2) {
        steps.append(
          mpFlowRow(["第一层更新后的节点表示", "二阶邻居消息"]),
          mpArrow(),
          element("div", "mp-flow-step hot", "跨层关系聚合"),
          mpArrow(),
          element("div", "mp-flow-step hot", "更新高阶节点表示")
        );
      } else {
        steps.append(
          mpFlowRow(["节点自身特征", "关系类型邻居消息"]),
          mpArrow(),
          element("div", "mp-flow-step hot", "关系聚合"),
          mpArrow(),
          element("div", "mp-flow-step hot", "更新节点表示")
        );
      }
      flowCard.append(steps);
      grid.append(flowCard);

      const stats = element("div", "mp-stats");
      const chain = buildLayerChain(viz, layer, hop);
      if (chain) stats.append(chain);

      const stateList = layer?.node_states || [];
      const messageCount = stateList.reduce((sum, state) => sum + (state.incoming || []).reduce((x, m) => x + m.count, 0), 0);
      const relLabels = [...new Set((layer?.edge_messages || []).map((m) => mpRelationLabels(viz)[m.relation_id] || m.relation_id))];
      stats.append(
        mpStatRow("聚合邻居数量", `${messageCount} 条消息`),
        mpStatRow("关系类型", relLabels.slice(0, 3).join("、") || "—"),
        mpStatRow("传播范围", isLayer2 ? "2-hop 邻居" : "1-hop 邻居"),
        mpStatRow("输出维度", "128 维节点 Embedding")
      );
      grid.append(stats);
      sec.body.append(grid);
      return sec.section;
    }

    function renderOutputSection(viz) {
      const sec = mpSection("节点表示学习结果", "Embedding 输出");
      const grid = element("div", "mp-output-grid");
      const sorted = [...(viz.nodes || [])].sort((a, b) => Number(b.importance || 0) - Number(a.importance || 0));
      sorted.slice(0, 3).forEach((node) => {
        const card = element("div", "mp-output-card");
        card.append(
          element("div", "mp-output-name", node.label || node.entity_id),
          element("div", "mp-output-dim", "Embedding: 128 维")
        );
        const score = element("div", "mp-output-score");
        const bar = element("i");
        bar.style.width = `${Math.max(0, Math.min(100, Number(node.importance || 0) * 100)).toFixed(1)}%`;
        score.append(bar);
        card.append(score);
        grid.append(card);
      });
      sec.body.append(grid);
      sec.body.append(element("div", "mp-connector", "↓ 连接节点评分模块"));
      return sec.section;
    }

    function renderMessagePassingV2(viz, answerIds) {
      const panel = element("section", "card");
      const head = element("div", "card-head");
      const headTitle = element("div", "card-title");
      headTitle.append(element("span", "dot"), document.createTextNode("R-GCN 消息传播"));
      head.append(headTitle, element("span", "badge accent", "2层关系图卷积"));
      panel.append(head);
      const body = element("div", "card-body");
      body.append(renderInputSection(viz));
      const layers = viz.layers || [];
      layers.slice(0, 2).forEach((layer, index) => {
        body.append(renderLayerSection(viz, layer, index + 1));
      });
      body.append(renderOutputSection(viz));
      panel.append(body);
      return panel;
    }

    function renderGnnVisualization(data) {
      const viz = data?.gnn_visualization;
      if (!viz || !viz.nodes || !viz.nodes.length) return document.createDocumentFragment();
      const answerIds = (data.candidates || []).map((c) => c.entity_id);
      const fragment = document.createDocumentFragment();
      fragment.append(
        renderGnnSubgraph(viz, answerIds),
        renderFeatureFusion(viz, answerIds),
        renderMessagePassingV2(viz, answerIds)
      );
      return fragment;
    }

    async function runInference() {
      rerunButton.disabled = true;
      copyButton.disabled = true;
      macroCard.hidden = true;
      showLoading();

      try {
        const params = new URLSearchParams(window.location.search);
        const qParam = params.get("q") || "1";
        const qi = Number(qParam);
        setActiveQuestion(qi);

        /* 并行请求：API（GNN推理）+ result.json（宏观子图原始数据） */
        const apiUrl = "/api/macro-infer?q=" + qParam;
        const [apiResp, resultResp] = await Promise.all([
          fetch(apiUrl, { headers: { Accept: "application/json" } }),
          fetch("result.json", { headers: { Accept: "application/json" } }).catch(() => null),
        ]);

        if (!apiResp.ok) throw new Error(`服务器返回 ${apiResp.status}`);

        const apiData = await apiResp.json();
        let resultData = null;
        if (resultResp && resultResp.ok) {
          const allResults = await resultResp.json();
          resultData = allResults.find((entry) => entry.question_id === "q" + qi) || null;
        }

        /* 宏观数据优先用 result.json，回退到 API */
        const macroData = resultData || apiData;
        const candidates = Array.isArray(apiData.candidates) ? apiData.candidates : [];
        const paths = Array.isArray(apiData.paths) ? apiData.paths : [];

        questionText.textContent = apiData.question || macroData.question_text || "未提供问题文本";
        renderMacroInfo(macroData);
        result.replaceChildren(
          renderCandidates(candidates),
          renderPaths(paths, apiData.topic_entities),
          renderGnnVisualization(apiData)
        );
      } catch (error) {
        showError(error instanceof Error ? error.message : "未知错误");
      } finally {
        rerunButton.disabled = false;
        copyButton.disabled = false;
      }
    }

    copyButton.addEventListener("click", () => {
      const text = questionText.textContent + "\n\n" + Array.from(result.querySelectorAll(".candidate")).map((el) => el.textContent.trim()).join("\n");
      navigator.clipboard?.writeText(text).catch(() => {});
    });

    document.querySelectorAll(".q-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const q = btn.dataset.q;
        history.replaceState(null, "", "?q=" + q);
        runInference();
      });
    });

    rerunButton.addEventListener("click", runInference);
    runInference();
  </script>
</body>
</html>
